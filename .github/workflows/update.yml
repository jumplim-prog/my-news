name: update news

on:
  schedule:
    - cron: '0 21,3,9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-news

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/run.js
      - run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add docs
          git diff --staged --quiet || git commit -m "update"
          git push
